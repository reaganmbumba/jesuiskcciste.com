name: Application Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KCC_VERSION_CODE: ${{ github.run_number }}
      KCC_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KCC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kcc.jks"
            echo "KCC_KEYSTORE_PATH=$RUNNER_TEMP/kcc.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé de signature : l'APK sera signé en mode debug et l'AAB ne sera pas accepté par Google Play."
          fi

      - name: Construire APK et AAB
        working-directory: android
        env:
          KCC_KEYSTORE_PASSWORD: ${{ secrets.KCC_KEYSTORE_PASSWORD }}
          KCC_KEY_ALIAS: ${{ secrets.KCC_KEY_ALIAS }}
          KCC_KEY_PASSWORD: ${{ secrets.KCC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KCC_KEYSTORE_PATH" ]; then ./gradlew assembleRelease bundleRelease; else ./gradlew assembleDebug bundleRelease; fi

      - name: Rassembler les fichiers
        run: |
          mkdir -p out
          cp $(find android/app/build/outputs/apk -name '*.apk' | head -1) out/kcc-connect.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/kcc-connect.aab

      - uses: actions/upload-artifact@v4
        with:
          name: kcc-connect-android
          path: out/

      - name: Publier la version GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-{0}', github.run_number) }}
          name: KCC Connect Android ${{ env.KCC_VERSION_NAME }}
          files: |
            out/kcc-connect.apk
            out/kcc-connect.aab
