name: Application Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KCC_VERSION_CODE: ${{ github.run_number }}
      KCC_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Préparer la clé de signature
        env:
          KCC_KEYSTORE_PASSWORD: ${{ secrets.KCC_KEYSTORE_PASSWORD }}
        run: |
          # La clé d'importation Google Play est dans le dépôt, chiffrée (android/kcc-upload.jks.enc).
          # Seul le mot de passe (secret GitHub KCC_KEYSTORE_PASSWORD) permet de l'ouvrir.
          if [ -n "$KCC_KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/kcc-upload.jks.enc \
              -out "$RUNNER_TEMP/kcc.jks" -pass env:KCC_KEYSTORE_PASSWORD
            echo "KCC_KEYSTORE_PATH=$RUNNER_TEMP/kcc.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KCC_KEYSTORE_PASSWORD absent : l'APK sera signé en mode debug et l'AAB ne sera pas accepté par Google Play."
          fi

      - name: Construire APK et AAB
        working-directory: android
        env:
          KCC_KEYSTORE_PASSWORD: ${{ secrets.KCC_KEYSTORE_PASSWORD }}
          KCC_KEY_ALIAS: kcc-upload
          KCC_KEY_PASSWORD: ${{ secrets.KCC_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KCC_KEYSTORE_PATH" ]; then ./gradlew assembleRelease bundleRelease; else ./gradlew assembleDebug bundleRelease; fi

      - name: Rassembler les fichiers
        run: |
          mkdir -p out
          cp $(find android/app/build/outputs/apk -name '*.apk' | head -1) out/kcc-connect.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/kcc-connect.aab
          cp out/kcc-connect.aab out/je-suis-kcciste-google-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: kcc-connect-android
          path: out/

      - name: Publier la version GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-{0}', github.run_number) }}
          name: KCC Connect Android ${{ env.KCC_VERSION_NAME }}
          files: |
            out/kcc-connect.apk
            out/kcc-connect.aab
            out/je-suis-kcciste-google-play.aab
