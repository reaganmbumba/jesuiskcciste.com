name: chk-tmp
on: { push: { branches: [claude/transcription-tmp] } }
jobs:
  t:
    if: "!contains(github.event.head_commit.message, 'skip')"
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 30); do c=$(curl -s -o /dev/null -w "%{http_code}" -H "Range: bytes=10000000-10000099" https://jesuiskcciste.com/radio/emissions/le-chemin-de-la-reconnaissance-2026-11-20.mp3); echo $c; [ "$c" = 206 ] && break; sleep 20; done
          [ "$c" = 206 ]
