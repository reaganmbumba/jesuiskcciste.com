name: Jingle de l'heure (voix)

# Fabrique les voix du jingle de l'heure « autour du monde » de Radio Je suis KCCiste
# quand tools/heure-monde/commande.txt change sur une branche de travail,
# puis les enregistre sur cette branche (tools/heure-monde/voix/).
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/heure-monde/commande.txt', 'tools/heure-monde/*.py', '.github/workflows/heure-monde.yml']

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'edge-tts>=6.1,<8'
      - name: Fabriquer les voix
        working-directory: tools/heure-monde
        run: python voix.py
      - name: Enregistrer les voix sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/heure-monde/voix
          git diff --cached --quiet || git commit -m "Voix du jingle de l'heure"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
