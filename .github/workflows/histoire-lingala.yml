name: Histoire en lingala (voix)

# Fabrique la voix lingala (Meta MMS-TTS) des textes tools/histoire-lingala/*.txt
# poussés sur une branche de travail, puis l'enregistre sur cette branche.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/histoire-lingala/*.txt', 'tools/histoire-lingala/voix.py', '.github/workflows/histoire-lingala.yml']

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install 'transformers>=4.40,<5' scipy numpy
      - name: Inspecter les modèles lingala
        run: |
          for m in multilingual-tts/VITS-OpenBible-Lingala multilingual-tts/F5-TTS-OpenBible-Lingala facebook/mms-tts; do
            echo "=== $m"; curl -s "https://huggingface.co/api/models/$m" | python -c "import json,sys;d=json.load(sys.stdin);print(d.get('cardData',{}).get('license'), d.get('gated'));[print('F', x['rfilename']) for x in d.get('siblings',[]) if 'lin' in x['rfilename'] or m!='facebook/mms-tts']" | head -40
            curl -sL "https://huggingface.co/$m/raw/main/README.md" | head -80 | sed 's/^/R /'
          done
      - name: Fabriquer la voix
        working-directory: tools/histoire-lingala
        run: for f in *.txt; do python voix.py "$f"; done
      - name: Enregistrer la voix sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/histoire-lingala/voix
          git diff --cached --quiet || git commit -m "Voix de l'histoire en lingala"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
