name: Radio Je suis KCCiste (Android)

# Fabrique l'application Android des auditeurs (APK) et la publie dans une version GitHub « radio-apk-N ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radio/android/**'
      - '.github/workflows/radio-android.yml'
  pull_request:
    paths:
      - 'radio/android/**'
      - '.github/workflows/radio-android.yml'

permissions:
  contents: write

env:
  KCC_VERSION_CODE: ${{ github.run_number }}
  KCC_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # même clé de signature d'une construction à l'autre : les mises à jour s'installent par-dessus
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kcc-radio-apk-key-v1
      - name: Clé de signature (secret facultatif)
        env:
          KEYSTORE_BASE64: ${{ secrets.KCC_RADIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radio.jks"
            echo "KCC_RADIO_KEYSTORE_PATH=$RUNNER_TEMP/radio.jks" >> "$GITHUB_ENV"
          fi
      - name: Construire l'APK
        working-directory: radio/android
        env:
          KCC_RADIO_KEYSTORE_PASSWORD: ${{ secrets.KCC_RADIO_KEYSTORE_PASSWORD }}
          KCC_RADIO_KEY_ALIAS: ${{ secrets.KCC_RADIO_KEY_ALIAS }}
          KCC_RADIO_KEY_PASSWORD: ${{ secrets.KCC_RADIO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out
          cp app/build/outputs/apk/debug/*.apk ../out/KCC-Radio.apk
      # Google Play : même application en .aab, signée avec la clé d'importation de l'application principale
      # (android/kcc-upload.jks.enc + secret KCC_KEYSTORE_PASSWORD). Numéro de version 100 + N, toujours
      # plus grand que les envois précédents sur Google Play.
      - name: Construire l'AAB Google Play
        working-directory: radio/android
        env:
          KCC_KEYSTORE_PASSWORD: ${{ secrets.KCC_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KCC_KEYSTORE_PASSWORD" ]; then echo "::warning::Secret KCC_KEYSTORE_PASSWORD absent : pas d'AAB."; exit 0; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../../android/kcc-upload.jks.enc \
            -out "$RUNNER_TEMP/kcc.jks" -pass env:KCC_KEYSTORE_PASSWORD
          KCC_PLAY_KEYSTORE_PATH="$RUNNER_TEMP/kcc.jks" KCC_VERSION_CODE=$((100 + ${{ github.run_number }})) \
            ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../out/KCC-Radio-google-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: KCC-Radio-apk
          path: radio/out/
      # Depuis une PR : version « pré-publication », pour récupérer les fichiers avant la fusion.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: radio-apk-${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          prerelease: ${{ github.event_name == 'pull_request' }}
          name: Radio Je suis KCCiste Android ${{ env.KCC_VERSION_NAME }}
          make_latest: false
          body: |
            Application Android des auditeurs de la Radio Je suis KCCiste : écouter le direct, lire le sujet, appeler l'émission.
            Alarme de 30 secondes avec jingle d'annonce dès qu'une émission commence.
          files: |
            radio/out/KCC-Radio.apk
            radio/out/KCC-Radio-google-play.aab
