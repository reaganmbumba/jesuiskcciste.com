name: tmp-check
on:
  push:
    branches: [claude/radio-synchro]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx tsc --noEmit -p worker 2>/dev/null || npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --types @cloudflare/workers-types worker/index.ts || true
      - run: npx vitest run
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/w 2>&1 | tail -5
