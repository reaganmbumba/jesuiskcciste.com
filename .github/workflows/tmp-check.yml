name: tmp-check
on:
  push:
    branches: [claude/radio-app-page]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          (npx vite preview --port 4173 &) ; sleep 6
          cat > shot.mjs <<'J'
          import { chromium, devices } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ ...devices['Pixel 7'] });
          await p.goto('http://localhost:4173/radio/app', { waitUntil: 'networkidle' });
          await p.waitForTimeout(3000);
          await p.screenshot({ path: 'shot1.png', fullPage: true });
          await p.locator('nav button').nth(1).click({ timeout: 5000 }).catch(() => {}); await p.waitForTimeout(800);
          await p.screenshot({ path: 'shot2.png', fullPage: true });
          await b.close();
          J
          node shot.mjs
      - if: always()
        run: |
          mkdir -p /tmp/s && cp shot*.png /tmp/s/ || true
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan claude/radio-shots && git rm -rfq . && cp /tmp/s/*.png . && git add *.png && git commit -qm shots && git push -f origin claude/radio-shots
