name: tmp-check
on:
  push:
    branches: [claude/radio-synchro]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://jesuiskcciste.com/radio/emissions/a-la-decouverte-echo-du-ciel-2026-11-19.webm https://jesuiskcciste.com/radio/emissions/tosungana-reponse-maman-mams-2026-11-19.mp3; do
            echo "== $u"; curl -s -r 1000000-1000099 -D - -o /tmp/part "$u" | grep -iE "^HTTP|content-range|accept-ranges|content-length"; echo "octets reçus: $(stat -c %s /tmp/part)"
          done
