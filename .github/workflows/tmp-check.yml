name: tmp-check
on: { push: { branches: [claude/radio-direct-sur-programme] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src/pages/admin/AdminRadioAntenne.tsx src/features/radio/RadioContext.tsx src/features/radio/RadioGrid.tsx || true
      - run: npx vitest run
      - run: npm run build
      - run: |
          for i in 1 2 3; do curl -s -o /dev/null -w "%{http_code}\n" -H "Range: bytes=1000000-1000099" https://jesuiskcciste.com/audio/petola-motema-ebnm-kcc.mp3; done
