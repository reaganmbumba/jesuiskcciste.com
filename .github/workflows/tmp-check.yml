name: tmp-check
on: { push: { branches: [claude/radio-partage-image] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - run: grep -o '<meta property="og:image" content="[^"]*"' dist/radio/index.html || find dist -path '*radio*' -name '*.html' | head
