name: tmp-check
on:
  push:
    branches: [claude/radio-synchro]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/w 2>&1 | tail -8
