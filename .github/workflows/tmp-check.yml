name: tmp-check
on:
  push:
    branches: [claude/test-range]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for k in $(seq 1 16); do
            code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://jesuiskcciste.com/api/live/call)
            echo "essai $k : /api/live/call -> HTTP $code $(head -c 80 /tmp/r)"
            [ "$code" != "405" ] && break; sleep 20
          done
          curl -s -r 0-9 -o /dev/null -w 'emission: HTTP %{http_code}\n' https://jesuiskcciste.com/radio/emissions/tosungana-reponse-maman-mams-2026-11-19.mp3
