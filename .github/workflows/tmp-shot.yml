name: tmp-shot
on: { push: { branches: [claude/radio-app-suivant] } }
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b && npx vitest run
      - run: npm run build
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (npx vite preview --port 4173 &) ; sleep 5; cp .github/tmp/shot.mjs ./shot.mjs && node shot.mjs
      - run: |
          mkdir /tmp/o && cp shot-app.png /tmp/o/ && cd /tmp/o && git init -q && git checkout -q -b claude/tmp-shot-out
          git -c user.name=ci -c user.email=ci@x add . && git -c user.name=ci -c user.email=ci@x commit -qm shot
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" claude/tmp-shot-out
