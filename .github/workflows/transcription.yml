name: transcription-tmp
on: { push: { branches: [claude/transcription-tmp] } }
permissions: { contents: write }
jobs:
  t:
    if: "!contains(github.event.head_commit.message, 'skip')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q faster-whisper
      - name: Exchange keys
        run: |
          set -e
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/runner.key 2>/dev/null
          openssl pkey -in /tmp/runner.key -pubout -out runner.pub
          git config user.name ci; git config user.email ci@example.com
          git add runner.pub; git commit -qm "runner key skip"; git push -q
          for i in $(seq 1 120); do git pull -q --rebase || true; [ -f key.rsa ] && break; sleep 10; done
          [ -f key.rsa ]
          openssl pkeyutl -decrypt -inkey /tmp/runner.key -in key.rsa -out /tmp/k
          openssl enc -d -aes-256-cbc -pbkdf2 -in audio.enc -out /tmp/a.mp3 -pass file:/tmp/k
      - name: Transcribe
        run: |
          python - <<'PY' > /tmp/out.txt
          from faster_whisper import WhisperModel
          m = WhisperModel("medium", device="cpu", compute_type="int8", cpu_threads=4)
          segs, info = m.transcribe("/tmp/a.mp3", beam_size=1, vad_filter=True, condition_on_previous_text=False)
          print("LANG", info.language, round(info.language_probability, 2))
          for s in segs:
              print(f"[{int(s.start//60):02d}:{int(s.start%60):02d}] {s.text.strip()}", flush=True)
          PY
          wc -l /tmp/out.txt
      - name: Return encrypted
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/out.txt -out out.enc -pass file:/tmp/k
          git pull -q --rebase || true
          git add out.enc; git commit -qm "result skip"; git push -q
