<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e16">
<title>KCC Studio Caméra</title>
<style>
:root{--bg:#0b0e16;--panel:#121725;--panel2:#1a2133;--line:#283049;--fg:#eef0f5;--muted:#9aa2b5;--gold:#d9b25a;--gold2:#f3d27a;--red:#e5484d;--green:#3fb27f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.view{position:fixed;inset:0;display:flex}

/* réglage */
#setup{overflow:auto;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
.box{width:min(560px,100%);display:flex;flex-direction:column;gap:12px;padding:8px 0 24px}
.head{display:flex;align-items:center;gap:12px}
.head img{width:52px;height:52px}
.head b{display:block;font-family:Georgia,serif;letter-spacing:.06em;color:var(--gold2);font-size:20px}
.head small{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:13px}
input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:17px;width:100%}
input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px;font-weight:700;font-size:16px;cursor:pointer}
.btn.gold{background:var(--gold);color:#0b1530;border-color:var(--gold)}
.btn.big{font-size:18px;padding:16px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.note{color:var(--muted);font-size:13px;margin:0}
.err{color:#ffb4b6;font-size:14px;margin:0}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}

/* scanner */
#scan{flex-direction:column;background:#000}
#scan video{flex:1;min-height:0;width:100%;object-fit:cover}
#scan .frame{position:absolute;left:50%;top:45%;width:min(64vw,64vh);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--gold2);border-radius:18px;box-shadow:0 0 0 100vmax #0008}
#scan .bar{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;background:linear-gradient(transparent,#000c)}

/* caméra en marche */
#live{background:#000}
#live video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#tally{position:absolute;inset:0;pointer-events:none;border:0 solid transparent;transition:border-color .2s}
#tally.program{border:10px solid var(--red)}
#tally.preview{border:6px solid var(--green)}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#000b,transparent)}
.st{font-weight:800;font-size:13px;padding:5px 11px;border-radius:999px;background:#000a;letter-spacing:.04em}
.st.program{background:var(--red)}
.st.preview{background:var(--green)}
.st.wait{background:#5a3a10}
.nm{font-weight:700;text-shadow:0 1px 3px #000}
.sp{flex:1}
.side{position:absolute;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.side button{width:56px;height:56px;border-radius:50%;border:1px solid #fff3;background:#000a;font-size:22px;display:grid;place-items:center;cursor:pointer}
.side button.on{background:var(--gold);color:#0b1530}
.side button.off{background:var(--red)}
#zoomBox{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(50vw,360px);display:flex;align-items:center;gap:8px;background:#000a;border-radius:999px;padding:6px 14px}
#zoomBox input{padding:0;accent-color:var(--gold);border:0;background:none}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000c;border-radius:14px;padding:16px 20px;max-width:80%;text-align:center}
</style>
</head>
<body>

<section id="setup" class="view">
  <div class="box">
    <div class="head"><img src="logo-kcc.png" alt=""><div><b>KCC Studio Caméra</b><small>Je suis KCCiste</small></div></div>
    <p class="note">Ce téléphone devient une caméra de la régie <b>Je suis KCCiste Studio</b>. Le téléphone et le PC de la régie doivent être sur <b>le même Wi-Fi</b>.</p>
    <button class="btn gold big" id="scanBtn">📷 Scanner le code de la régie</button>
    <label>Ou tapez l'adresse affichée sur la régie
      <input id="host" inputmode="url" autocomplete="off" placeholder="192.168.1.20:8787">
    </label>
    <div class="recent" id="recent"></div>
    <label>Nom de cette caméra
      <input id="name" maxlength="40" placeholder="Caméra 1 (chaire)">
    </label>
    <button class="btn big" id="goBtn">Se connecter</button>
    <p class="err" id="setupErr" hidden></p>
  </div>
</section>

<section id="scan" class="view" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div class="frame"></div>
  <div class="bar"><span>Visez le code QR affiché sur l'écran de la régie</span><button class="btn" id="scanCancel">Annuler</button></div>
</section>

<section id="live" class="view" hidden>
  <video id="preview" playsinline muted autoplay></video>
  <div id="tally"></div>
  <div class="top"><span class="st wait" id="state">Connexion…</span><span class="nm" id="nm"></span><span class="sp"></span><span class="nm" id="info"></span></div>
  <div class="side">
    <button id="flipBtn" title="Caméra avant / arrière">🔄</button>
    <button id="torchBtn" title="Lampe" hidden>🔦</button>
    <button id="micBtn" title="Micro">🎙️</button>
    <button id="hdBtn" title="Qualité">HD</button>
    <button id="quitBtn" title="Quitter">✕</button>
  </div>
  <div id="zoomBox" hidden><span>🔍</span><input type="range" id="zoom" step="0.1"></div>
  <div id="msg" hidden></div>
</section>

<script src="jsQR.js"></script>
<script src="camera.js"></script>
</body>
</html>
